name: reliefnet
x-backend: &backend
  build: ./backend
  environment: &environment
    DATABASE_URL: postgresql+psycopg://reliefnet:${POSTGRES_PASSWORD:-reliefnet-local-demo-only}@postgres:5432/reliefnet
    RABBITMQ_URL: amqp://reliefnet:${RABBITMQ_PASSWORD:-reliefnet-broker-demo-only}@rabbitmq:5672/%2F
    DEMO_ADMIN_KEY: ${DEMO_ADMIN_KEY:-local-demo-admin}
    NODE_URLS: '{"A":"http://node-a:8100","B":"http://node-b:8100","C":"http://node-c:8100"}'
    BACKEND_URL: http://backend:8000
  restart: unless-stopped
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    environment:
      POSTGRES_DB: reliefnet
      POSTGRES_USER: reliefnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reliefnet-local-demo-only}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U reliefnet]
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: reliefnet
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-reliefnet-broker-demo-only}
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *backend
    restart: 'no'
    command: sh -c "alembic upgrade head && python -m app.seed"
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    <<: *backend
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  node-a:
    <<: *backend
    environment:
      <<: *environment
      NODE_ID: A
      NODE_PRIORITY: 1
    command: uvicorn app.node:app --host 0.0.0.0 --port 8100
    healthcheck: &node-health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
  node-b:
    <<: *backend
    environment:
      <<: *environment
      NODE_ID: B
      NODE_PRIORITY: 2
    command: uvicorn app.node:app --host 0.0.0.0 --port 8100
    healthcheck: *node-health
  node-c:
    <<: *backend
    environment:
      <<: *environment
      NODE_ID: C
      NODE_PRIORITY: 3
    command: uvicorn app.node:app --host 0.0.0.0 --port 8100
    healthcheck: *node-health
  worker:
    <<: *backend
    command: python -m app.worker
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:5173:80']
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres-data:
  rabbit-data:
